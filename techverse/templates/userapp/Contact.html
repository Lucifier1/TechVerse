{% extends 'userapp/master.html' %}
{% load static %} 

{% block content %}

<div class="container-fluid position-relative p-0">
  <div class="header-section">
    <div class="header-content">
      <h1>Contact Us</h1>
      <p>Let’s team up to create new ideas and smart solutions.</p>
    </div>
  </div>
</div>

<div class="container-md py-5">
  <div class="d-flex flex-column align-items-center">
    <h2 class="text-blue fw-bold">Get in Touch</h2>
    <p class="mb-0 text-center" style="max-width: 500px;">Call or visit us anytime. We reply to all questions within 24 hours.</p>
  </div>
  <div class="row">
    <div class="col-lg-6 col-sm-12 d-flex flex-column justify-content-center align-items-start">
      <img src="{% static 'userapp/images/contact.svg' %}" alt="Contact Us" class="w-100">
    </div>
    <div class="col-lg-6 col-sm-12">
      <div class="contact-form">
        <form method="post" id="contactForm">
          {% csrf_token %}
          <div class="row mb-2">
            <div class="col-md-6">
              <label class="form-label mb-0">First Name</label>
              <input type="text" name="first_name" class="form-control pt-0" required pattern="[A-Za-z]+" title="Only alphabetic characters allowed.">
            </div>
            <div class="col-md-6">
              <label class="form-label mb-0">Last Name</label>
              <input type="text" name="last_name" class="form-control pt-0" required pattern="[A-Za-z]+" title="Only alphabetic characters allowed.">
            </div>
          </div>

          <div class="row mb-2">
            <div class="col-md-6">
              <label class="form-label mb-0">Company</label>
              <input type="text" name="company" class="form-control pt-0" required>
            </div>
            <div class="col-md-6">
              <label class="form-label mb-0">Phone</label>
              <input id="phone" type="tel" name="phone" class="form-control pt-0" required>
              <input type="hidden" name="full_phone" id="full_phone">
              <input type="hidden" name="country_name" id="country_name">
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label mb-0">Email Address</label>
            <input type="email" name="email" class="form-control pt-0" required>
          </div>
          <div class="mb-2">
            <label class="form-label mb-0">Subject</label>
            <input type="text" name="subject" class="form-control pt-0" required>
          </div>
          <div class="mb-2">
            <label class="form-label mb-0">Message</label>
            <textarea class="form-control" name="message" rows="3" required placeholder="Start typing here..."></textarea>
          </div>
          <button type="submit" class="btn neon-button text-white px-4">Send</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- ✅ intl-tel-input CSS & JS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const phoneInput = document.querySelector("#phone");

    const iti = window.intlTelInput(phoneInput, {
      initialCountry: "us",  // ✅ Default USA
      separateDialCode: true,
      preferredCountries: ["us", "in", "gb", "ae"], // top countries on top
      utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"
    });

    const form = document.querySelector("#contactForm");

    form.addEventListener("submit", function (e) {
      if (!iti.isValidNumber()) {
        e.preventDefault();
        alert("❌ Please enter a valid phone number for the selected country.");
        phoneInput.focus();
        return false;
      }

      // ✅ Store full phone with country code
      document.querySelector("#full_phone").value = iti.getNumber();

      // ✅ Store selected country name
      const countryData = iti.getSelectedCountryData();
      document.querySelector("#country_name").value = countryData.name;
    });
  });
</script>

{% endblock %}
