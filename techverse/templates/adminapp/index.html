{% extends 'adminapp/master.html' %}
{% load static %}
{% block content %}

<!-- Main Content -->
<div class="main-content">
  <section class="section">
    <div class="row">
      <!-- Career Inquiry Card -->
      <div class="col-xl-3 col-lg-6 col-md-6 col-sm-6 col-xs-12">
        <div class="card">
          <div class="card-statistic-4">
            <div class="align-items-center justify-content-between">
              <div class="row">
                <div class="col-12 pr-0 pt-3">
                  <div class="card-content">
                    <h5 class="font-15">Career Inquiry</h5>
                    <h2 class="mb-3 font-18">{{ total_inquiries }}</h2>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Contact Inquiry Card -->
      <div class="col-xl-3 col-lg-6 col-md-6 col-sm-6 col-xs-12">
        <div class="card">
          <div class="card-statistic-4">
            <div class="align-items-center justify-content-between">
              <div class="row">
                <div class="col-12 pr-0 pt-3">
                  <div class="card-content">
                    <h5 class="font-15">Contact Inquiry</h5>
                    <h2 class="mb-3 font-18">{{ total_contact_inquiries }}</h2>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Histogram Chart Section -->
    <div class="row mt-4">
      <div class="col-12">
        <div class="card shadow">
          <div class="card-header">
            <h4 class="mb-0">Inquiry Distribution (Histogram)</h4>
          </div>
          <div class="card-body">
            <canvas id="histogramChart" height="120"></canvas>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const ctx = document.getElementById('histogramChart').getContext('2d');
  const histogramChart = new Chart(ctx, {
    type: 'bar',
    data: {
      // Example "bins" (you could replace with weeks, ranges, etc.)
      labels: ['0-5', '6-10', '11-15', '16-20', '21-25', '26-30'],
      datasets: [
        {
          label: 'Career Inquiries',
          data: [2, 5, 7, 12, 9, 15], // Example distribution
          backgroundColor: 'rgba(54, 162, 235, 0.6)',
          borderColor: 'rgba(54, 162, 235, 1)',
          borderWidth: 1
        },
        {
          label: 'Contact Inquiries',
          data: [3, 6, 4, 10, 11, 18], // Example distribution
          backgroundColor: 'rgba(255, 99, 132, 0.6)',
          borderColor: 'rgba(255, 99, 132, 1)',
          borderWidth: 1
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        title: {
          display: true,
          text: 'Inquiry Histogram (Binned Frequency)'
        },
        legend: {
          position: 'bottom'
        }
      },
      scales: {
        x: {
          title: {
            display: true,
            text: 'Inquiry Ranges'
          }
        },
        y: {
          beginAtZero: true,
          title: {
            display: true,
            text: 'Count'
          }
        }
      }
    }
  });
</script>

{% endblock %}
